<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="prockallsyms — penetration testing, security research, Rust" />
    <meta property="og:title" content="prockallsyms" />
    <meta property="og:description" content="prockallsyms — penetration testing, security research, Rust" />
    <meta property="og:type" content="website" />
    <title>prockallsyms</title>
    <!-- Relative base: resolves to / locally, /portfolio/ on the GH Pages project site.
         automatically — no basename prop needed (§A.4). -->
    <base href="./" />
    <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg" />
    <link rel="stylesheet" href="./css/app.css" />
    <script>
      // Theme bootstrap — runs before first paint (prevents dark-mode flash).
      // The Yew ThemeToggle (T04) reads the same key and keeps it in sync.
      (function () {
        var t = localStorage.getItem("theme");
        var dark = t === "dark" || (t !== "light" && matchMedia("(prefers-color-scheme: dark)").matches);
        if (dark) document.documentElement.classList.add("dark");
      })();
    </script>
  </head>
  <body class="bg-[var(--bg)] text-[var(--fg)] antialiased">
    <div id="app"></div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
